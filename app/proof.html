<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FixProof · Comparison</title>
  <link rel="stylesheet" href="/proof.css">
  <script src="/proof.js" defer></script>
</head>
<body>
  <main>
    <header>
      <a class="brand" href="/">FixProof</a>
      <nav aria-label="Example resources">
        <a id="example-link" href="/example/" hidden>Recorded example</a>
        <a href="/baseline/">Baseline cart</a>
        <a href="/candidate/">Candidate cart</a>
      </nav>
    </header>

    <p id="loading" class="notice" role="status">Loading comparison…</p>

    <div id="comparison" hidden>
      <section class="intro" aria-labelledby="case-title">
        <p class="source-label" id="source-label"></p>
        <h1 id="case-title"></h1>
        <dl class="run-metadata">
          <div><dt>Run ID</dt><dd><code id="run-id"></code></dd></div>
          <div><dt id="date-label">Run date</dt><dd id="run-date"></dd></div>
        </dl>
      </section>
      <div id="checks"></div>
      <section class="checks" id="incomplete-example" aria-labelledby="incomplete-title" hidden>
        <h2 id="incomplete-title">Incomplete execution example</h2>
        <p id="incomplete-reason"></p>
      </section>
    </div>
  </main>
</body>
</html>
